name: Build Windows download

on:
  workflow_dispatch:
  push:
    branches: ['fix/plc-mw2-mw3-camera-default']
    paths: ['package.json', '.github/workflows/windows-release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:model
      - name: Test camera comparison, PLC and MP4 conversion
        shell: pwsh
        run: |
          $testLog = & npm test 2>&1
          $testExit = $LASTEXITCODE
          $testLog | ForEach-Object { Write-Output $_ }
          if ($testExit -ne 0) {
            $details = ($testLog -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows tests failed::$details"
          }
          exit $testExit
      - name: Test actual camera comparison and recording
        shell: pwsh
        run: |
          $testLog = & npm run test:camera 2>&1
          $testExit = $LASTEXITCODE
          $testLog | ForEach-Object { Write-Output $_ }
          if ($testExit -ne 0) {
            $details = ($testLog -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Test actual camera comparison and recording failed::$details"
          }
          exit $testExit
      - run: npm run dist:win -- --config.win.signAndEditExecutable=false
      - name: Test packaged model runtime and video converter
        shell: pwsh
        run: |
          $testLog = & npm run test:packaged 2>&1
          $testExit = $LASTEXITCODE
          $testLog | ForEach-Object { Write-Output $_ }
          if ($testExit -ne 0) {
            $details = ($testLog -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Test packaged model runtime and video converter failed::$details"
          }
          exit $testExit
      - name: Upload Windows executable and publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --prerelease --title "People Count Monitor $version" --notes "%MW0 옆에 %MW2·%MW3 표시, CCTV 기본 주소 IVA_AREA 적용. 카메라 영상의 통행 인원과 PLC 값을 독립적으로 비교합니다. 먼저 AI 비교 설정에서 실제 영상 영역·출입선·PLC 값 의미를 지정하고 자동 녹화를 켜세요. 정상 일치 구간은 작은 비교 기록만 남기고, 불일치·판단 불확실 구간은 감지 전 5초부터 마지막 감지 후 10초까지 MP4로 보관합니다. 겹침·분석 지연·연결 중단은 확인 필요로 처리합니다. 사람 감지는 내장 로컬 CPU 모델을 사용합니다. 저장 영상은 자동 삭제하지 않습니다. 현장 카메라의 실제 인식률은 직접 확인해야 합니다. 아래 Assets에서 EXE를 다운로드하세요."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist/People-Count-Monitor-$version.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          exit $LASTEXITCODE
