name: Build Windows download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test PLC and MP4 conversion
        shell: pwsh
        run: |
          $testLog = & npm test 2>&1
          $testExit = $LASTEXITCODE
          $testLog | ForEach-Object { Write-Output $_ }
          if ($testExit -ne 0) {
            $details = ($testLog -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows tests failed::$details"
          }
          exit $testExit
      - run: npm run test:camera
      - run: npm run dist:win -- --config.win.signAndEditExecutable=false
      - run: npm run test:packaged
      - name: Upload Windows executable and publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "People Count Monitor $version" --notes "녹화 파일을 시간 이동이 가능한 MP4(H.264/AAC)로 저장합니다. 중지 후 MP4 저장 완료를 기다리세요. 기존 WebM 파일은 상단 MP4 변환 버튼으로 바꿀 수 있으며 원본은 유지합니다. Windows에서 실제 화면 녹화·MP4 앞뒤 탐색과 배포본 내장 변환기를 검증한 빌드입니다. 아래 Assets에서 EXE를 다운로드하세요."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist/People-Count-Monitor-$version.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          exit $LASTEXITCODE
