name: Build Windows download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Test PLC and MP4 conversion
        shell: pwsh
        run: |
          $testLog = & npm test 2>&1
          $testExit = $LASTEXITCODE
          $testLog | ForEach-Object { Write-Output $_ }
          if ($testExit -ne 0) {
            $details = ($testLog -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows tests failed::$details"
          }
          exit $testExit
      - run: npm run test:camera
      - run: npm run dist:win -- --config.win.signAndEditExecutable=false
      - run: npm run test:packaged
      - name: Upload Windows executable and publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "People Count Monitor $version" --notes "PLC 값 변화에 따른 통행 자동 녹화 ON/OFF를 추가했습니다. 아래 왼쪽 자동 녹화 켜기를 누르고 저장 폴더를 선택하세요. 변화 전 5초부터 마지막 변화 후 10초까지 MP4로 저장하며, 연속 통행은 연장하고 60초 단위로 나눕니다. 대기용 임시 영상은 돌려 쓰고 정상 OFF 시 정리합니다. Windows에서 실제 PLC 모의 신호·자동 저장·MP4 시간 탐색·OFF 뒤 수동 녹화 및 배포본 내장 변환기를 검증한 빌드입니다. 아래 Assets에서 EXE를 다운로드하세요."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist/People-Count-Monitor-$version.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          exit $LASTEXITCODE
