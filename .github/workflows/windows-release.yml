name: Build Windows download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run dist:win -- --config.win.signAndEditExecutable=false
      - name: Upload Windows executable and publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v1.0.0 --draft --target $env:GITHUB_SHA --title "People Count Monitor 1.0.0" --notes "Windows x64용 카메라·YouTube·LS PLC 통합 모니터. 아래 Assets에서 EXE를 다운로드하세요. 사용법은 저장소 README를 확인하세요."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload v1.0.0 "dist/People-Count-Monitor-1.0.0.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v1.0.0 --draft=false
          exit $LASTEXITCODE
