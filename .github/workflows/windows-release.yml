name: Build Windows download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:camera
      - run: npm run dist:win -- --config.win.signAndEditExecutable=false
      - name: Upload Windows executable and publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "People Count Monitor $version" --notes "프로그램 창 전체 WebM 녹화, 선택형 PC 소리 녹음, 웹 탭 추가·삭제, 웹 창 닫기·재추가, 좌우·위아래 비율과 창 높이 조절 지원. Windows에서 카메라·웹 탭·배치 및 실제 녹화 파일 재생 테스트를 통과한 빌드입니다. 아래 Assets에서 EXE를 다운로드하세요."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist/People-Count-Monitor-$version.exe" --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false
          exit $LASTEXITCODE
