name: Rename project repositories

on:
  workflow_dispatch:

permissions: {}

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rename using the repository administration token
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ.get('REPO_ADMIN_TOKEN')
          if not token:
              sys.exit('Add REPO_ADMIN_TOKEN in repository Settings > Secrets and variables > Actions first. Never paste it in workflow inputs or logs.')
          owner = 'seoljaegeun3-svg'
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'project-repository-rename'}
          def api(name, payload=None):
              data = json.dumps(payload).encode() if payload else None
              request = urllib.request.Request('https://api.github.com/repos/' + owner + '/' + name, data=data, headers=headers, method='PATCH' if payload else 'GET')
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and payload is None:
                      return None
                  message = json.load(error).get('message', 'GitHub request failed')
                  sys.exit(f'{name}: HTTP {error.code}: {message}')
          plan = []
          for old, new in [('insurance-ai-marketing', 'people-counter-native'), ('1', 'people-count-monitor')]:
              source = api(old)
              if source is None:
                  sys.exit(f'Cannot access source repository: {old}')
              if source['owner']['login'].lower() != owner or source['name'] not in [old, new]:
                  sys.exit(f'Unexpected repository identity: {old}')
              destination = api(new)
              if destination is not None and destination['id'] != source['id']:
                  sys.exit(f'Name already belongs to another repository: {new}')
              plan.append((source, new))
          # Rename this workflow's own repository last; repeat runs skip completed changes.
          for source, new in plan:
              result = source if source['name'] == new else api(source['name'], {'name': new})
              if result['full_name'] != owner + '/' + new:
                  sys.exit('Rename returned an unexpected repository identity')
              print('Confirmed: ' + result['html_url'])
          PY
